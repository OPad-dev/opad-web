# Builds the site and publishes it on GitHub Pages.
#
# The build fetches the docs and the case model from OPad's main branch on GitHub
# (scripts/opad-repo.mjs), so every run publishes what OPad's main has now. It runs on
# every push here, by hand, when OPad asks for it (a repository_dispatch of type
# "opad-updated"), and every day as a fallback, so the docs never lag main for long.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [opad-updated]
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Fails if OPad's docs link to a page or file that does not exist.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
